name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Chrome is available
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            google-chrome-stable --version
          else
            sudo apt-get update
            # Try Chrome Stable, fallback to Chromium
            sudo apt-get install -y google-chrome-stable || sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          fi
          echo "CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium)" >> $GITHUB_ENV

      - name: Unit tests (CI + coverage)
        env:
          CI: 'true'
        run: npm test -- --watch=false --browsers=ChromeHeadless --code-coverage --progress=false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn

      - name: Production build
        run: npm run build -- --configuration production

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: warn

      - name: Docker build (validation)
        run: docker build -f dockerfile -t coinupfront:ci .
