apiVersion: apps/v1
kind: Deployment
metadata:
  name: coinupfront
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coinupfront
  template:
    metadata:
      labels:
        app: coinupfront
    spec:
      containers:
        - name: coinupfront
          # Replace with your built/pushed image
          image: your-registry/coinupfront:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: coinupfront-config
                  key: BACKEND_URL
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
